<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>系統診斷 · 浚鍵管理</title>
<style>
body{font-family:monospace;padding:16px;background:#111;color:#0f0;font-size:13px;line-height:1.6}
h1{color:#ffd700;font-size:18px}
.ok{color:#0f0}.fail{color:#f00}.warn{color:#ff0}.info{color:#0af}
pre{background:#000;padding:12px;border-radius:8px;overflow:auto;max-height:none;white-space:pre-wrap;word-break:break-all}
button{background:#ffd700;color:#000;border:none;padding:10px 20px;border-radius:8px;font-weight:700;cursor:pointer;margin-top:10px;font-size:14px}
</style>
</head>
<body>
<h1>🔍 系統診斷報告</h1>
<button onclick="location.reload()">🔄 重新檢查</button>
<pre id="output">檢查中⋯</pre>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script src="routes.js"></script>
<script src="voice.js"></script>
<script src="messages.js"></script>
<script src="gps.js"></script>
<script src="walkie.js"></script>
<script src="bookings.js"></script>
<script src="admin.js"></script>
<script src="app.js"></script>

<script>
const out = document.getElementById('output');
const lines = [];
function add(status, msg) {
  const cls = status === 'ok' ? 'ok' : status === 'fail' ? 'fail' : status === 'warn' ? 'warn' : 'info';
  lines.push('<span class="' + cls + '">[' + status.toUpperCase() + ']</span> ' + msg);
}
function render() { out.innerHTML = lines.join('\n'); }

/* ---------- 1. 核心物件 ---------- */
add('info', '===== 1. 核心物件 =====');
add(typeof firebase !== 'undefined' ? 'ok' : 'fail', 'firebase 全域物件: ' + typeof firebase);
add(typeof db !== 'undefined' ? 'ok' : 'fail', 'db (Firebase Database): ' + typeof db);
add(typeof auth !== 'undefined' ? 'ok' : 'fail', 'auth (Firebase Auth): ' + typeof auth);

/* ---------- 2. 關鍵函數 ---------- */
add('info', '===== 2. 關鍵函數是否存在 =====');
const funcs = [
  'bindSetPlateButton', 'startDuty', 'stopDuty',
  'addPass', 'subPass', 'toggleFull', 'switchDir', 'toggleMode', 'toggleCarSeats',
  'loadAdminPanel', 'loadAdminList', 'updateAdminBookingStats', 'updateOnlineLists',
  'initBookings', 'loadShiftClaims', 'setupRecordButton', 'playBoostedAudio',
  'goToNextStation', 'goToPrevStation', 'speakCantonese'
];
funcs.forEach(f => {
  const exists = typeof window[f] === 'function' || eval('typeof ' + f) === 'function';
  add(exists ? 'ok' : 'fail', 'function ' + f + ': ' + (exists ? '存在 ✅' : '不存在 ❌'));
});

/* ---------- 3. DOM 元素 ---------- */
add('info', '===== 3. 關鍵 DOM 元素 =====');
const domEls = [
  ['btn-set-plate', '車牌設定按鈕'],
  ['driver-plate-input', '車牌輸入框'],
  ['start-gps', '開始當值按鈕'],
  ['d-info', '司機資訊顯示'],
  ['tab-admin', '後台 Tab'],
  ['admin-msg-list', '後台訊息列表'],
  ['admin-device-list', '設備列表'],
  ['admin-list', '管理員列表'],
  ['shift-morning', '早上班次'],
  ['login-id', '登入輸入框']
];
domEls.forEach(([id, name]) => {
  const el = document.getElementById(id);
  add(el ? 'ok' : 'warn', 'DOM #' + id + ' (' + name + '): ' + (el ? '存在' : '不存在（正常，如果唔喺本頁）'));
});

/* ---------- 4. 全域狀態 ---------- */
add('info', '===== 4. 全域狀態 =====');
if (typeof driverData !== 'undefined') {
  add('ok', 'driverData.plate = ' + JSON.stringify(driverData.plate));
  add('ok', 'driverData.isActive = ' + driverData.isActive);
  add('ok', 'driverData.mode = ' + driverData.mode + ', direction = ' + driverData.direction);
} else {
  add('fail', 'driverData 未定義');
}
if (typeof currentUser !== 'undefined') {
  add('ok', 'currentUser.identifier = ' + JSON.stringify(currentUser.identifier));
  add('ok', 'currentUser.role = ' + currentUser.role);
  add('ok', 'currentUser.uid = ' + (currentUser.uid || 'null'));
} else {
  add('fail', 'currentUser 未定義');
}
add('ok', 'isAdmin = ' + (typeof isAdmin !== 'undefined' ? isAdmin : 'undefined'));
add('ok', 'isSuperAdmin = ' + (typeof isSuperAdmin !== 'undefined' ? isSuperAdmin : 'undefined'));
add('ok', 'voiceEnabled = ' + (typeof voiceEnabled !== 'undefined' ? voiceEnabled : 'undefined'));

/* ---------- 5. LocalStorage ---------- */
add('info', '===== 5. LocalStorage =====');
try {
  const saved = JSON.parse(localStorage.getItem('savedPlates') || '{}');
  add('ok', 'savedPlates = ' + JSON.stringify(saved));
} catch (e) {
  add('fail', 'savedPlates 解析失敗: ' + e.message);
}
add('ok', 'pax_session = ' + (localStorage.getItem('pax_session') ? '有' : '無'));
add('ok', 'globalVoice = ' + (localStorage.getItem('globalVoice') || '無'));

/* ---------- 6. Firebase 資料讀取 ---------- */
add('info', '===== 6. Firebase 資料（非同步） =====');
(async function checkFirebase() {
  try {
    // 先登入匿名
    if (typeof auth !== 'undefined' && !auth.currentUser) {
      try {
        await auth.signInAnonymously();
        add('ok', '匿名登入成功，uid = ' + auth.currentUser.uid);
      } catch (e) {
        add('fail', '匿名登入失敗: ' + e.message);
      }
    } else if (auth && auth.currentUser) {
      add('ok', '已有登入用戶，uid = ' + auth.currentUser.uid);
    }

    // 測試讀取各節點
    const nodes = [
      ['admins', '/admins（管理員名單）'],
      ['drivers', '/drivers（司機名單）'],
      ['bans', '/bans（封鎖名單）'],
      ['van/active_buses', '/van/active_buses（在線車輛）'],
      ['van/messages', '/van/messages（訊息）'],
      ['van/announcements', '/van/announcements（公告）'],
      ['login_logs', '/login_logs（登入記錄）'],
      ['booking_seats', '/booking_seats（班次認領）']
    ];
    for (const [path, label] of nodes) {
      try {
        const snap = await db.ref(path).limitToLast(50).once('value');
        const val = snap.val() || {};
        const count = Object.keys(val).length;
        add('ok', '讀取 ' + label + ': ' + count + ' 筆 ✅');
        if (path === 'admins') {
          for (const k in val) {
            add('info', '  → admins[' + k + '] = ' + JSON.stringify(val[k]));
          }
        }
        if (path === 'drivers') {
          for (const k in val) {
            add('info', '  → drivers[' + k + '] = ' + JSON.stringify(val[k]));
          }
        }
      } catch (e) {
        add('fail', '讀取 ' + label + ' 失敗: ' + e.message);
      }
    }
  } catch (e) {
    add('fail', 'Firebase 檢查異常: ' + e.message);
  }
  render();
})();

render();
</script>
</body>
</html>
