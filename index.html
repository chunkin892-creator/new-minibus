async function fetchIP() {
  if (_lastKnownIP) return _lastKnownIP;
  const apis = [
    'https://api.ipify.org?format=json',
    'https://api64.ipify.org?format=json',
    'https://ipapi.co/json/'
  ];
  for (const url of apis) {
    try {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 5000);
      const res = await fetch(url, { signal: controller.signal });
      clearTimeout(timeout);
      if (!res.ok) continue;
      const data = await res.json();
      const ip = data.ip || data.query || null;
      if (ip) {
        _lastKnownIP = ip;
        console.log('🌐 已獲取 IP:', ip);
        return ip;
      }
    } catch(e) { /* 試下一個 */ }
  }
  console.warn('⚠️ 無法獲取 IP');
  return '未能獲取';
}

const _toastQueue = [];
let _toastBusy = false;
function _processToastQueue() {
  if (_toastBusy || _toastQueue.length === 0) return;
  _toastBusy = true;
  const msg = _toastQueue.shift();
  const t = document.getElementById('toast');
  if (!t) { _toastBusy = false; return; }
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => {
    t.classList.remove('show');
    setTimeout(() => { _toastBusy = false; _processToastQueue(); }, 300);
  }, 2500);
}
function showToast(msg) {
  if (_toastQueue.length > 5) _toastQueue.shift();
  _toastQueue.push(msg);
  _processToastQueue();
}
function vibrate(ms) { try { if (navigator.vibrate) navigator.vibrate(ms || 30); } catch(e) {} }

// ✅ 語音佇列
const _speakQueue = [];
let _speakBusy = false;
function _processSpeakQueue() {
  if (_speakBusy || _speakQueue.length === 0) return;
  _speakBusy = true;
  const item = _speakQueue.shift();
  const { text, resolve } = item;
  if (!voiceEnabled || !window.speechSynthesis) { _speakBusy = false; resolve(); setTimeout(_processSpeakQueue, 0); return; }
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'zh-HK'; utter.volume = 1; utter.rate = 0.9;
  const voices = window.speechSynthesis.getVoices();
  if (voices.length > 0) {
    const voice = voices.find(v => v.lang === 'zh-HK') || voices.find(v => v.lang.startsWith('zh'));
    if (voice) utter.voice = voice;
  }
  let resolved = false;
  const done = () => { if (!resolved) { resolved = true; resolve(); _speakBusy = false; setTimeout(_processSpeakQueue, 0); } };
  const timer = setTimeout(done, 6000);
  utter.onend = () => { clearTimeout(timer); done(); };
  utter.onerror = () => { clearTimeout(timer); done(); };
  window.speechSynthesis.speak(utter);
}
function speakCantonese(text) {
  if (!voiceEnabled || !window.speechSynthesis) return Promise.resolve();
  return new Promise(resolve => {
    if (_speakQueue.length > 3) _speakQueue.shift();
    _speakQueue.push({ text, resolve });
    _processSpeakQueue();
  });
}

function calcDistance(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function getSupportedMimeType() {
  if (typeof MediaRecorder === 'undefined' || !MediaRecorder.isTypeSupported) return '';
  const candidates = ['audio/webm;codecs=opus','audio/webm','audio/mp4;codecs=mp4a.40.2','audio/mp4','audio/aac','audio/ogg;codecs=opus'];
  for (const t of candidates) { try { if (MediaRecorder.isTypeSupported(t)) return t; } catch(e) {} }
  return '';
}
function playAudioFallback(base64, mimeType, boost) {
  try {
    const mime = mimeType || 'audio/webm';
    const audio = new Audio('data:' + mime + ';base64,' + base64);
    audio.volume = Math.min(1, (boost || 10) / 10);
    audio.setAttribute('playsinline', 'true');
    audio.play().catch(() => console.warn('音頻播放失敗'));
    return audio;
  } catch(e) { console.error('playAudioFallback 錯誤:', e); return null; }
}
function playBoostedAudio(base64, boost, mimeType) {
  if (!base64) return;
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (isIOS) { playAudioFallback(base64, mimeType || 'audio/mp4', boost); return; }
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const bytes = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
    ctx.decodeAudioData(bytes.buffer, buf => {
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const gain = ctx.createGain();
      gain.gain.value = (boost || 10) / 10;
      src.connect(gain); gain.connect(ctx.destination); src.start(0);
    }, () => playAudioFallback(base64, mimeType || 'audio/webm', boost));
  } catch(e) { playAudioFallback(base64, mimeType || 'audio/webm', boost); }
}
window.playBoostedAudio = playBoostedAudio;
function setupRecordButton(btnId, timerId, callback) {
  const btn = document.getElementById(btnId);
  if (!btn) return;
  const timer = document.getElementById(timerId);
  let isRecording = false, mediaRecorder = null, mediaStream = null, audioChunks = [], recordingTimer = null, recSeconds = 0, cancelled = false;
  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'record-cancel-btn';
  cancelBtn.type = 'button';
  cancelBtn.textContent = '✕';
  cancelBtn.title = '取消錄音';
  cancelBtn.setAttribute('aria-label', '取消錄音');
  if (btn.parentNode) { btn.parentNode.style.position = 'relative'; btn.parentNode.appendChild(cancelBtn); }
  function resetUI() {
    isRecording = false;
    clearInterval(recordingTimer); recordingTimer = null; recSeconds = 0;
    btn.classList.remove('recording');
    cancelBtn.classList.remove('show');
    if (timer) { timer.style.display = 'none'; timer.textContent = ''; }
  }
  function cancelRecording() {
    cancelled = true;
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      try { mediaRecorder.onstop = null; mediaRecorder.stop(); } catch(e) {}
    }
    if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
    resetUI(); vibrate(20); showToast('已取消錄音');
  }
  function startRecording() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { showToast('此裝置不支援錄音'); return; }
    cancelled = false;
    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(stream => {
        mediaStream = stream;
        const mimeType = getSupportedMimeType();
        const options = { audioBitsPerSecond: CONFIG.VOICE_BITRATE };
        if (mimeType) options.mimeType = mimeType;
        let recorder;
        try { recorder = new MediaRecorder(stream, options); }
        catch(e) { try { recorder = new MediaRecorder(stream, { mimeType: mimeType || undefined }); } catch(e2) { recorder = new MediaRecorder(stream); } }
        mediaRecorder = recorder;
        audioChunks = [];
        const actualMime = mediaRecorder.mimeType || mimeType || 'audio/webm';
        mediaRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = () => {
          if (cancelled) { cancelled = false; resetUI(); return; }
          try {
            const blob = new Blob(audioChunks, { type: actualMime });
            if (blob.size < 200) { showToast('錄音太短，已取消'); resetUI(); return; }
            const reader = new FileReader();
            reader.onload = () => {
              try {
                const base64 = reader.result.split(',')[1];
                if (callback) callback(base64, actualMime);
                showToast('錄音已發送'); vibrate(30);
              } catch(err) { console.error(err); }
            };
            reader.readAsDataURL(blob);
          } catch(err) { console.error(err); }
          resetUI();
        };
        mediaRecorder.start();
        isRecording = true;
        btn.classList.add('recording');
        recSeconds = 0;
        cancelBtn.classList.add('show');
        vibrate(20);
        if (timer) { timer.style.display = 'block'; timer.textContent = CONFIG.RECORD_MAX_SECONDS + 's'; }
        recordingTimer = setInterval(() => {
          recSeconds++;
          const remain = CONFIG.RECORD_MAX_SECONDS - recSeconds;
          if (timer) timer.textContent = Math.max(0, remain) + 's';
          if (recSeconds >= CONFIG.RECORD_MAX_SECONDS) {
            clearInterval(recordingTimer); recordingTimer = null;
            if (mediaRecorder && mediaRecorder.state === 'recording') {
              try { mediaRecorder.stop(); } catch(e) {}
              if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
            }
            showToast('已達 30 秒上限，自動發送');
          }
        }, 1000);
      })
      .catch(err => { console.error('getUserMedia 錯誤:', err); showToast('無法開啟咪高峰'); resetUI(); });
  }
  function stopAndSend() {
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      try { mediaRecorder.stop(); } catch(e) {}
      if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
    }
  }
  cancelBtn.addEventListener('click', function(e) { e.stopPropagation(); e.preventDefault(); if (isRecording) cancelRecording(); });
  btn.addEventListener('click', function(e) { e.preventDefault(); e.stopPropagation(); if (isRecording) stopAndSend(); else startRecording(); });
  btn.addEventListener('touchend', function(e) { e.preventDefault(); }, { passive: false });
}

function cleanLoginLogs() {
  const now = Date.now();
  if (now - _lastLoginLogClean < 60 * 60 * 1000) return;
  _lastLoginLogClean = now;
  db.ref('login_logs').orderByChild('loginTime').once('value').then(snap => {
    const arr = [];
    snap.forEach(c => arr.push({ key: c.key, t: c.val().loginTime || 0 }));
    arr.sort((a,b) => b.t - a.t);
    const toDelete = arr.slice(CONFIG.LOG_KEEP_MAX);
    if (toDelete.length === 0) return;
    const updates = {};
    toDelete.forEach(x => { updates[x.key] = null; });
    db.ref('login_logs').update(updates).then(() => console.log('🧹 已清理 login_logs:', toDelete.length));
  }).catch(err => console.warn('清理 login_logs 失敗:', err));
}

function renderDriverRouteStrip() {
  const strip = document.getElementById('d-route-strip'); if (!strip) return;
  const route = getRoute(); const idx = driverData.stationIndex || 0;
  const children = strip.children;
  if (children.length === route.length) {
    for (let i = 0; i < route.length; i++) {
      const node = children[i];
      node.className = 'dot-node';
      if (i < idx) node.classList.add('passed');
      else if (i === idx) node.classList.add('current');
      else if (i === idx + 1) node.classList.add('next');
      const span = node.querySelector('span');
      if (span && span.textContent !== route[i]) span.textContent = route[i];
    }
  } else {
    strip.innerHTML = '';
    route.forEach((name, i) => {
      const node = document.createElement('div');
      node.className = 'dot-node';
      if (i < idx) node.classList.add('passed');
      else if (i === idx) node.classList.add('current');
      else if (i === idx + 1) node.classList.add('next');
      node.innerHTML = `<div class="dot"></div><span>${name}</span>`;
      strip.appendChild(node);
    });
  }
  if (idx !== lastDriverScrollIndex) {
    const current = strip.querySelector('.dot-node.current');
    if (current) {
      const stripRect = strip.getBoundingClientRect();
      const nodeRect = current.getBoundingClientRect();

  driverMsgRef = db.ref('van/messages').orderByChild('busId').equalTo(driverData.plate || '');
  driverMsgRef.on('value', async snap => {
    const banned = await isBanned(currentUser.uid);
    let hasNewMsg = false, lastMsg = null, lastSender = null, lastType = 'text', newestKey = null;
    ['driver-msg-list','driver-msg-list-overlay'].forEach(id => {
      const el = document.getElementById(id); if (!el) return;

      const items = [];
      snap.forEach(child => {

        if (msg.hidden || banned) return;
        items.push({ key: child.key, msg });
      });
      items.sort((a,b) => b.msg.timestamp - a.msg.timestamp);
      if (items.length > 0 && !newestKey) newestKey = items[0].key;
      const fragment = document.createDocumentFragment();
      items.forEach(item => {
        const msg = item.msg;
        const div = document.createElement('div');
        div.className = 'msg-row';
        const timeStr = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString('zh-HK') : '';
        const timeSpan = document.createElement('span');
        timeSpan.className = 'msg-time';

        div.appendChild(timeSpan);
        if (msg.audio) {
          const btn = document.createElement('button');
          btn.className = 'play-audio'; btn.textContent = '▶ 語音';
          btn.addEventListener('click', ()=> playBoostedAudio(msg.audio, CONFIG.VOICE_MSG_BOOST, msg.audioMime));
          div.appendChild(btn);
          const span = document.createElement('span'); span.textContent = '🎤 語音訊息';
          div.appendChild(span);
          if (!lastMsg && id === 'driver-msg-list') { lastMsg = '🎤 語音訊息'; lastSender = msg.senderIdentifier || '乘客'; lastType = 'audio'; }
        } else {
          const txt = document.createTextNode((msg.senderIdentifier||'') + ': ' + (msg.text||'(訊息)'));
          div.appendChild(txt);
          if (!lastMsg && id === 'driver-msg-list') { lastMsg = msg.text || '(訊息)'; lastSender = msg.senderIdentifier || '乘客'; lastType = 'text'; }
        }
        const canDelete = (msg.senderUid === currentUser.uid) || isSuperAdmin;
        if (canDelete) {
          const delBtn = document.createElement('button');
          delBtn.className = 'btn btn-secondary';
          delBtn.style.cssText = 'width:auto;padding:4px 10px;font-size:13px;';
          delBtn.textContent = '🗑️';
          delBtn.addEventListener('click', ()=>{
            if (confirm('確定刪除此訊息？')) db.ref('van/messages/'+item.key).remove().then(()=>showToast('已刪除'));
          });
          div.appendChild(delBtn);
        }
        fragment.appendChild(div);
        hasNewMsg = true;
      });
      el.appendChild(fragment);
    });
    if (hasNewMsg && newestKey && newestKey !== lastDriverMsgKey) {
      lastDriverMsgKey = newestKey;
      if (lastMsg) showMsgNotification(lastType, lastSender, lastMsg);
      if (driverMsgScrollTimer) clearTimeout(driverMsgScrollTimer);
      driverMsgScrollTimer = setTimeout(() => {
        const msgArea = document.querySelector('#view-driver .msg-area');
        if (msgArea) {
          msgArea.scrollIntoView({ behavior: 'smooth', block: 'end' });
          const msgList = msgArea.querySelector('.msg-list');
          if (msgList) msgList.scrollTop = msgList.scrollHeight;
        }
      }, 300);
    }
  });
  updateDriverUI();
  const sg = document.getElementById('start-gps'); if (sg) sg.style.display = driverData.isActive ? 'none' : 'block';
  const stg = document.getElementById('stop-gps'); if (stg) stg.style.display = driverData.isActive ? 'block' : 'none';
  if (driverData.isActive && driverData.plate && !gpsWatchId) startGpsWatch();
  setTimeout(scrollToPassengerCard, 500);
}

      div.appendChild(timeSpan);
      if (msg.audio) {
        const btn = document.createElement('button');
        btn.className = 'play-audio'; btn.textContent = '▶ 語音';

        div.appendChild(span);
      } else {

        });

}
function renderPassRouteStrip(bus) {
  const strip = document.getElementById('pass-route-strip'); if (!strip) return;
  strip.innerHTML = '';
  let route;
  if (bus.mode === 'busy') route = bus.direction === 0 ? BUSY_GO : BUSY_BACK;
  else route = bus.direction === 0 ? NORMAL_GO : NORMAL_BACK;
  const current = bus.stationIndex || 0;
  if (!route || route.length === 0) { strip.innerHTML = '<div style="color:#888;padding:10px;">路線資料載入中...</div>'; return; }
  route.forEach((name, idx) => {
    const node = document.createElement('div');
    node.className = 'dot-node';
    if (idx < current) node.classList.add('passed');
    else if (idx === current) node.classList.add('current');
    else if (idx === current + 1) node.classList.add('next');
    node.innerHTML = `<div class="dot"></div><span>${name}</span>`;
    strip.appendChild(node);
  });
  const currentDot = strip.querySelector('.dot-node.current');
  if (currentDot) setTimeout(()=> currentDot.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'}), 100);
}

function loadDeviceList() {
  try {
    const container = document.getElementById('admin-device-list'); if (!container) return;
    container.innerHTML = `<div class="collapsible-list"><button class="toggle-btn" id="device-toggle-btn">📋 顯示全部</button><div class="list-container" id="device-list-container"></div></div>`;
    const listContainer = document.getElementById('device-list-container');
    const toggleBtn = document.getElementById('device-toggle-btn');
    let allData = [], expanded = false;
    if (deviceLogRef) deviceLogRef.off();
    deviceLogRef = db.ref('login_logs').orderByChild('loginTime').limitToLast(CONFIG.LOG_KEEP_MAX);
    deviceLogRef.on('value', snap => {
      try {
        const data = snap.val() || {};
        allData = [];
        for (const key in data) {
          const log = data[key];
          allData.push({
            uid: log.uid, identifier: log.identifier || '未知', role: log.role || '未知',
            ip: log.ip || '未能獲取', device: log.device || '未知', os: log.os || '未知',
            browser: log.browser || '未知', loginTime: log.loginTime || 0,
            loginTimeStr: log.loginTime ? new Date(log.loginTime).toLocaleString('zh-HK') : '未知'
          });
        }
        allData.sort((a,b) => (b.loginTime || 0) - (a.loginTime || 0));
        renderDeviceList(allData, expanded);
      } catch(e) { console.error(e); }
    });
    function renderDeviceList(data, expand) {
      try {
        let html = '';
        const displayData = expand ? data : data.slice(0, 10);
        if (data.length === 0) html = '<div style="color:#888;text-align:center;padding:12px;">暫無登入記錄</div>';
        else {
          displayData.forEach(item => {
            const ipColor = item.ip && item.ip !== '未能獲取' ? '#0f0' : '#f80';
            html += `<div class="admin-item" style="border-left-color:var(--gold);padding:10px;">
              <div class="title">📱 ${item.device}</div>
              <div class="info">
                <strong>識別:</strong> ${item.identifier}<br>
                <strong>角色:</strong> ${item.role}<br>
                <strong>系統:</strong> ${item.os} | <strong>瀏覽器:</strong> ${item.browser}<br>
                <strong>IP:</strong> <span style="color:${ipColor};font-weight:bold;">${item.ip}</span><br>
                <strong>登入時間:</strong> ${item.loginTimeStr}
              </div>
            </div>`;
          });
        }
        listContainer.innerHTML = html;
        toggleBtn.textContent = expand ? '📋 收起' : `📋 顯示全部 (${data.length} 條)`;
      } catch(e) { console.error(e); }
    }
    toggleBtn.addEventListener('click', function(){ expanded = !expanded; renderDeviceList(allData, expanded); });
  } catch(e) { console.error('loadDeviceList 失敗:', e); }
}

function loadAdminAnnounce() {
  try {
    if (adminAnnounceRef) adminAnnounceRef.off();
    adminAnnounceRef = db.ref('van/announcements').orderByChild('timestamp').limitToLast(20);
    adminAnnounceRef.on('value', snap => {
      try {
        const container = document.getElementById('admin-announce-list'); if (!container) return;
        if (!container.dataset.initialized) {
          container.dataset.initialized = 'true';
          container.innerHTML = `<div class="collapsible-list"><button class="toggle-btn" id="announce-toggle-btn">📋 顯示全部</button><div class="list-container" id="announce-list-container"></div></div>`;
        }
        const listContainer = document.getElementById('announce-list-container');
        const toggleBtn = document.getElementById('announce-toggle-btn');
        let allData = [], expanded = false;
        snap.forEach(child => { allData.push({key: child.key, ann: child.val()}); });
        allData.sort((a,b) => b.ann.timestamp - a.ann.timestamp);
        function renderAnnouncements(expand) {
          try {
            let html = '';
            const displayData = expand ? allData : allData.slice(0, 5);
            displayData.forEach(item => {
              const ann = item.ann, isAudio = !!ann.audio;
              const isSuperPub = isAnnounceFromSuperAdmin(ann);
              html += `<div class="admin-item" style="border-left-color:var(--gold);padding:8px 10px;">
                <div class="info">${new Date(ann.timestamp).toLocaleString('zh-HK')} ${isSuperPub ? '⭐ 超級管理員' : ''}</div>
                <div style="font-size:15px;">${isAudio ? '🎤 [語音公告]' : (ann.text||'')}</div>
                ${isAudio ? `<button class="play-audio play-ann-audio" data-key="${item.key}">▶ 播放</button>` : ''}
                <button class="btn btn-secondary del-ann-btn" style="width:auto;padding:4px 10px;font-size:13px;" data-key="${item.key}">🗑️</button>
              </div>`;
            });
            if (allData.length === 0) html = '<div style="color:#888;padding:8px;font-size:15px;">暫無公告</div>';
            listContainer.innerHTML = html;
            toggleBtn.textContent = expand ? '📋 收起' : `📋 顯示全部 (${allData.length} 條)`;
            listContainer.querySelectorAll('.play-ann-audio').forEach(btn => {
              btn.addEventListener('click', function(){
                const key = this.dataset.key;
                const found = allData.find(x => x.key === key);
                if (found && found.ann.audio) playBoostedAudio(found.ann.audio, CONFIG.VOICE_ANNOUNCE_BOOST, found.ann.audioMime);
              });
            });
            listContainer.querySelectorAll('.del-ann-btn').forEach(btn => {
              btn.addEventListener('click', function(){
                const key = this.dataset.key;
                const found = allData.find(x => x.key === key);
                if (found) window.deleteAnnounce(key, found.ann);
              });
            });
          } catch(e) { console.error(e); }
        }
        if (!toggleBtn.dataset.bound) {
          toggleBtn.dataset.bound = 'true';
          toggleBtn.addEventListener('click', function(){ expanded = !expanded; renderAnnouncements(expanded); });
        }
        renderAnnouncements(false);
      } catch(e) { console.error(e); }
    });
  } catch(e) { console.error('loadAdminAnnounce 失敗:', e); }
}
window.deleteAnnounce = function(key, ann) {
  if (!checkCanDeleteAnnounce(ann)) return;

function initAdminWalkie() {
  if (!isAdmin) return;
  try {
    updateAdminWalkieTargets();
    if (adminWalkieRef) adminWalkieRef.off();
    adminWalkieRef = db.ref('van/walkie_talkie').orderByChild('timestamp').limitToLast(50);
    adminWalkieRef.on('value', snap => {
      try {
        const container = document.getElementById('admin-walkie-messages'); if (!container) return;
        container.innerHTML = '';
        const fragment = document.createDocumentFragment();
        snap.forEach(child => {
          const msg = child.val();
          if (msg.hidden) return;
          const time = new Date(msg.timestamp).toLocaleTimeString('zh-HK');
          const sender = msg.senderPlate || '未知司機';
          const target = msg.target === 'all' ? '📢全部' : msg.target;
          const div = document.createElement('div');
          div.style.cssText = 'padding:4px 0;border-bottom:1px solid #333;font-size:14px;';
          const spanTime = document.createElement('span');
          spanTime.style.color = '#888'; spanTime.textContent = `[${time}] `;
          div.appendChild(spanTime);
          const strong = document.createElement('strong');
          strong.textContent = sender + ' → ' + target + ': ';
          div.appendChild(strong);
          if (msg.audio) {
            const btn = document.createElement('button');
            btn.className = 'play-audio'; btn.textContent = '▶ 語音';
            btn.addEventListener('click', ()=> playBoostedAudio(msg.audio, CONFIG.VOICE_MSG_BOOST, msg.audioMime));
            div.appendChild(btn);
          } else {
            div.appendChild(document.createTextNode(msg.text || ''));
          }
          const delBtn = document.createElement('button');
          delBtn.className = 'btn btn-secondary';
          delBtn.style.cssText = 'width:auto;padding:4px 10px;font-size:13px;';
          delBtn.textContent = '🗑️';
          delBtn.addEventListener('click', ()=>{
            if (confirm('管理員刪除此對講機訊息？')) db.ref('van/walkie_talkie/'+child.key).remove().then(()=>showToast('已刪除'));
          });
          div.appendChild(delBtn);
          fragment.appendChild(div);
        });
        container.appendChild(fragment);
        if (container.children.length === 0) {
          const empty = document.createElement('div');
          empty.style.cssText = 'color:#888;font-size:14px;text-align:center;padding:12px;';
          empty.textContent = '暫無對講機訊息';
          container.appendChild(empty);
        }
      } catch(e) { console.error(e); }
    });
  } catch(e) { console.error('initAdminWalkie 失敗:', e); }
}
function updateAdminWalkieTargets() {
  const select = document.getElementById('admin-walkie-target'); if (!select) return;
  db.ref('van/active_buses').once('value', snap => {
    const data = snap.val() || {};

    for (const plate in data) {
      if (Date.now() - data[plate].lastUpdate < CONFIG.ACTIVE_BUS_TIMEOUT) html += `<option value="${plate}">🚐 ${plate}</option>`;

document.getElementById('login-google').addEventListener('click', function(){
  if (isLoggingIn) { showToast('⏳ 登入處理中，請稍候'); return; }
  isLoggingIn = true;
  showLoading('Google 登入中...');
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider)
    .then(async result => {
      const user = result.user; const email = user.email;
      const role = await checkRole(email);
      if (role !== 'admin') { showToast('此 Google 帳戶不是管理員'); auth.signOut(); hideLoading(); isLoggingIn = false; return; }
      currentUser.uid = user.uid; currentUser.identifier = email; currentUser.role = role; currentUser.loginTime = Date.now();
      isSuperAdmin = isSuperAdminEmail(email); isAdmin = true;
      await db.ref('users/' + user.uid).set({ identifier: email, role, lastLogin: Date.now() });
      // ✅ 寫入含 IP 嘅登入記錄
      await logLogin(user.uid, email, role);
      document.getElementById('login-modal').classList.remove('active');
      document.getElementById('btn-admin-panel').style.display = 'block';
      loadAdminPanel(); initAdminWalkie(); applyAdminPermissions();
      showToast('管理員登入成功，歡迎 ' + email + (isSuperAdmin ? ' (超級管理員)' : ' (普通管理員)'));
      if (voiceEnabled) speakCantonese('管理員登入成功');
      showView('view-lobby');
      hideLoading();
      isLoggingIn = false;
    })
    .catch(err => {
      hideLoading();
      isLoggingIn = false;
      if (err.code === 'auth/popup-closed-by-user') showToast('登入視窗已關閉，請重新嘗試');
      else if (err.code === 'auth/cancelled-popup-request') showToast('請勿重複點擊');
      else showToast('登入失敗：' + err.message);
      console.error(err);
    });
});

function loadAnnounceList(){
  const container = document.getElementById('announce-list-content'); if (!container) return;
  db.ref('van/announcements').orderByChild('timestamp').limitToLast(20).once('value', snap => {
    container.innerHTML = '';
    snap.forEach(child => {
      const ann = child.val(), isAudio = !!ann.audio;
      const div = document.createElement('div');
      div.className = 'announce-item';
      const time = document.createElement('div');
      time.className = 'time';
      time.textContent = new Date(ann.timestamp).toLocaleString('zh-HK');
      div.appendChild(time);
      const text = document.createElement('div');
      text.className = 'text';
      text.textContent = isAudio ? '🎤 [語音公告]' : (ann.text || '');
      div.appendChild(text);
      if (isAudio) {
        const playBtn = document.createElement('button');
        playBtn.className = 'play-audio'; playBtn.textContent = '▶ 播放';
        playBtn.addEventListener('click', ()=> playBoostedAudio(ann.audio, CONFIG.VOICE_ANNOUNCE_BOOST, ann.audioMime));
        div.appendChild(playBtn);
      }
      container.appendChild(div);
    });
    if (container.children.length === 0) {
      const empty = document.createElement('div');
      empty.style.cssText = 'text-align:center;color:#888;padding:20px;font-size:18px;';
      empty.textContent = '暫無公告';
      container.appendChild(empty);
    }
  });
}

function showMsgNotification(type, sender, text) {
  const el = document.getElementById('msg-notification');
  const icon = document.getElementById('notif-icon');
  const title = document.getElementById('notif-title');
  const sub = document.getElementById('notif-sub');
  if (!el) return;
  if (notificationTimer) { clearTimeout(notificationTimer); notificationTimer = null; }
  if (type === 'audio') { icon.textContent = '🎤'; title.textContent = '新語音訊息'; sub.textContent = `來自 ${sender || '乘客'}`; }
  else { icon.textContent = '📩'; title.textContent = text ? text.substring(0, 30) + (text.length > 30 ? '...' : '') : '新訊息'; sub.textContent = `來自 ${sender || '乘客'}`; }
  el.classList.add('show');
  notificationTimer = setTimeout(() => { el.classList.remove('show'); notificationTimer = null; }, 3500);
}

auth.onAuthStateChanged(function(user){
  if (user) {
    db.ref('users/'+user.uid).once('value').then(snap => {
      const data = snap.val();
      if (!data) return;
      currentUser.uid = user.uid;
      currentUser.identifier = data.identifier || '';
      currentUser.role = data.role || 'passenger';
      if (currentUser.role === 'admin') {
        isAdmin = true; isSuperAdmin = isSuperAdminEmail(currentUser.identifier);
        document.getElementById('btn-admin-panel').style.display = 'block';
        loadAdminPanel(); initAdminWalkie(); applyAdminPermissions();
      } else { isAdmin = false; isSuperAdmin = false; }
      document.getElementById('login-modal').classList.remove('active');
      showToast('歡迎回來，' + currentUser.identifier);
      if (currentUser.role === 'driver' || currentUser.role === 'admin') {
        const savedPlate = getSavedPlate(currentUser.identifier);
        if (savedPlate) {
          db.ref('van/active_buses/' + savedPlate).once('value', snap => {
            const busData = snap.val();
            if (busData && busData.isActive === true) {
              driverData.plate = savedPlate;
              driverData.mode = busData.mode || 'busy';
              driverData.direction = busData.direction || 0;
              driverData.stationIndex = busData.stationIndex || 0;
              driverData.passengerCount = busData.passengerCount || 0;
              driverData.isActive = true;
              driverData.carSeats = busData.carSeats || 16;
              driverData.isFull = busData.isFull || false;
              lastReportedIndex = driverData.stationIndex;
              lastDriverScrollIndex = -1;
              updateDriverUI();
              document.getElementById('start-gps').style.display = 'none';
              document.getElementById('stop-gps').style.display = 'block';
              setTimeout(() => { if (driverData.isActive && !gpsWatchId) startGpsWatch(); }, 1000);
              showToast('已自動恢復當值狀態');
            }
          });
        }
      }
    });
  }
});
function cleanOldMessages() {
  const cutoff = Date.now() - CONFIG.MESSAGE_TTL_MS;
  db.ref('van/messages').orderByChild('timestamp').endAt(cutoff).once('value')
    .then(snapshot => {
      const updates = {}; let count = 0;
      snapshot.forEach(child => { updates[child.key] = null; count++; });
      if (count > 0) { db.ref('van/messages').update(updates); console.log(`🧹 已自動刪除 ${count} 條超過 48 小時嘅訊息`); }
    }).catch(err => console.warn('清理訊息失敗:', err));
  db.ref('van/walkie_talkie').orderByChild('timestamp').endAt(cutoff).once('value')
    .then(snapshot => {
      const updates = {}; let count = 0;
      snapshot.forEach(child => { updates[child.key] = null; count++; });
      if (count > 0) { db.ref('van/walkie_talkie').update(updates); console.log(`🧹 已自動刪除 ${count} 條超過 48 小時嘅對講機訊息`); }
    }).catch(err => console.warn('清理對講機訊息失敗:', err));
}

  if (!email || !email.includes('@')) { showToast('請輸入有效的 Google 電郵'); return; }
  db.ref('admins').push({ identifier: email, email: email, addedBy: currentUser.identifier, createdAt: Date.now() }).then(() => {
    input.value = '';
    document.getElementById('admin-add-admin-status').textContent = '✅ 已新增管理員：' + email;
    showToast('管理員已新增');
    loadAdminList();
  });
});
safeClick(document.getElementById('admin-walkie-refresh'), updateAdminWalkieTargets);
setupRecordButton('btn-admin-walkie-record', 'admin-walkie-timer', (base64, mime) => {
  const target = document.getElementById('admin-walkie-target')?.value || 'all';
  db.ref('van/walkie_talkie').push({
    senderUid: currentUser.uid, senderIdentifier: currentUser.identifier + ' (👑管理員)',
    senderPlate: '👑 管理員', target: target, audio: base64, audioMime: mime || 'audio/webm',
    timestamp: Date.now(), type: 'walkie_audio'
  }).then(() => { showToast('管理員對講機語音已發送'); });
});
safeClick(document.getElementById('btn-clear-walkie'), function(e) {
  if (!isAdmin) { showToast('⛔ 權限不足'); return; }
  if (!confirm('⚠️ 確定清除所有對講機訊息？')) return;
  db.ref('van/walkie_talkie').once('value', snap => {
    const updates = {};
    snap.forEach(child => { updates[child.key] = null; });
    if (Object.keys(updates).length === 0) { showToast('目前沒有對講機訊息'); return; }
    db.ref('van/walkie_talkie').update(updates).then(() => { showToast('✅ 已清除所有對講機訊息'); });
  });
});
window.startDuty = startDuty;
window.stopDuty = stopDuty;
console.log('✅ 西鐵小巴系統 v3.0 已就緒');
</script>
</body>
