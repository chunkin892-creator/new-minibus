<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>浚鍵管理有限公司 · 西鐵小巴系統</title>
<style>
:root{--bg:#0a0805;--gold:#d4af37;--gold-b:#f5d76e;--txt:#f5f0e1;--txt2:#a89b7a;--line:rgba(212,175,55,.18)}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(circle at top,rgba(212,175,55,.08),transparent 50%),radial-gradient(circle at bottom,rgba(220,38,38,.08),transparent 50%),linear-gradient(180deg,#0a0805,#1a150d);color:var(--txt);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}

/* 卡片式小巴 */
.bus-card{
  background:linear-gradient(145deg,#1a150d,#252017);
  border:2px solid #d4af37;
  border-radius:22px;
  padding:14px;
  box-shadow:0 12px 40px rgba(212,175,55,.25),0 0 60px rgba(220,38,38,.15);
  max-width:300px;
  width:88vw;
  margin-bottom:26px;
  position:relative;
  animation:cardFloat 3s ease-in-out infinite;
}
@keyframes cardFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
}
.bus-card::before{
  content:'';
  position:absolute;
  inset:-2px;
  border-radius:22px;
  padding:2px;
  background:linear-gradient(135deg,#f5d76e,#d4af37,#8b6914,#d4af37);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  pointer-events:none;
}
.bus-card img{
  width:100%;
  border-radius:14px;
  display:block;
  filter:saturate(1.35) contrast(1.12) brightness(1.02);
}
.bus-card-label{
  text-align:center;
  margin-top:12px;
  padding:10px 8px;
  background:linear-gradient(135deg,#f5d76e,#d4af37);
  border-radius:12px;
  box-shadow:inset 0 -2px 6px rgba(139,105,20,.3);
}
.bus-plate{
  font-size:22px;
  font-weight:900;
  color:#1a150d;
  letter-spacing:4px;
  font-family:'Courier New',monospace;
}
.bus-route{
  font-size:12px;
  color:#4a3800;
  margin-top:3px;
  font-weight:700;
  letter-spacing:.5px;
}

/* 標題 */
h1{font-size:26px;font-weight:800;background:linear-gradient(135deg,#f5d76e,#d4af37);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;letter-spacing:2px}
.sub{font-size:14px;color:var(--txt2);margin-bottom:36px;letter-spacing:1px}
.divider{width:120px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:0 auto 32px}

/* 按鈕 */
.btn{display:block;width:100%;max-width:320px;padding:22px;margin-bottom:16px;border-radius:16px;font-size:18px;font-weight:700;text-decoration:none;text-align:center;transition:all .2s;border:1px solid var(--line);cursor:pointer;font-family:inherit}
.btn:active{transform:scale(.97)}
.btn-driver{background:linear-gradient(135deg,#252017,#1a150d);color:var(--gold-b);border:1px solid var(--gold);box-shadow:0 4px 20px rgba(212,175,55,.2)}
.btn-driver:hover{background:linear-gradient(135deg,#2a2418,#252017);box-shadow:0 6px 28px rgba(212,175,55,.35)}
.btn-passenger{background:linear-gradient(135deg,#f5d76e,#d4af37);color:#1a150d;box-shadow:0 4px 24px rgba(212,175,55,.45);border-color:transparent}
.btn-passenger:hover{box-shadow:0 6px 32px rgba(212,175,55,.6)}

/* 資訊盒 */
.info-box{margin-top:22px;padding:16px;font-size:12px;line-height:1.9;background:rgba(0,0,0,.4);border:1px solid var(--line);color:var(--txt2);border-radius:12px;max-width:320px;width:100%;text-align:left}
.info-box strong{color:var(--gold-b)}
.footer{margin-top:32px;font-size:11px;color:#5a5240;line-height:1.6;letter-spacing:.5px}
</style>
</head>
<body>

<!-- 🚐 卡片式小巴 -->
<div class="bus-card">
  <img src="cg2893.jpg" alt="CG2893 小巴">
  <div class="bus-card-label">
    <div class="bus-plate">CG 2893</div>
    <div class="bus-route">元朗站 ⇄ 大棠黃泥墩</div>
  </div>
</div>

<h1>浚鍵管理有限公司</h1>
<div class="sub">西鐵小巴系統</div>
<div class="divider"></div>

<a href="driver-pro.html" class="btn btn-driver">🚏 司機專業端</a>
<a href="passenger.html" class="btn btn-passenger">🧍 乘客專用端</a>

<div class="info-box">
  <strong>🚏 司機端</strong><br>班次認領 · 留位總覽座位圖 · 即時彈窗通知 · 對講機<br><br>
  <strong>🧍 乘客端</strong><br>留位預約 · 路線追蹤 · 車牌查看 · 語音訊息 · 我已上車
</div>
<div class="footer">© 浚鍵管理有限公司<br>開發者 大輝</div>
</body>
</html>
